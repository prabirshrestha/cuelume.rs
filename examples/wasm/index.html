<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuelume WebAssembly Example</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #090d16;
        color: #eef3ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(circle at 20% 0%, #183454 0, transparent 38%),
          radial-gradient(circle at 90% 90%, #311d50 0, transparent 36%),
          #090d16;
      }

      main {
        width: min(760px, 100%);
        padding: clamp(24px, 5vw, 48px);
        border: 1px solid #2b3850;
        border-radius: 24px;
        background: rgb(13 20 33 / 88%);
        box-shadow: 0 28px 80px rgb(0 0 0 / 40%);
        backdrop-filter: blur(18px);
      }

      header { margin-bottom: 32px; }

      .eyebrow {
        margin: 0 0 8px;
        color: #70d7ff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 7vw, 56px);
        line-height: 1;
        letter-spacing: -0.045em;
      }

      .intro {
        max-width: 590px;
        margin: 16px 0 0;
        color: #aab7cc;
        font-size: 16px;
        line-height: 1.6;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-bottom: 28px;
      }

      label {
        display: grid;
        gap: 10px;
        color: #cfdaeb;
        font-size: 14px;
        font-weight: 650;
      }

      input { width: 100%; accent-color: #70d7ff; }

      .sounds {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
        gap: 10px;
      }

      button {
        min-height: 46px;
        border: 1px solid #34445f;
        border-radius: 12px;
        background: #172237;
        color: #e9f1ff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      }

      button:hover {
        border-color: #70d7ff;
        background: #21324d;
        transform: translateY(-1px);
      }

      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 3px solid #70d7ff55; outline-offset: 2px; }

      #status {
        min-height: 24px;
        margin: 24px 0 0;
        color: #8ee5bc;
        font-size: 14px;
      }

      @media (max-width: 520px) {
        .controls { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Rust + Web Audio</p>
        <h1>Cuelume</h1>
        <p class="intro">Procedural interaction sounds, rendered in Rust and played in your browser. Click a sound to initialize Web Audio.</p>
      </header>

      <section class="controls" aria-label="Playback controls">
        <label for="volume">
          Volume
          <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8">
        </label>
        <label for="panning">
          Panning
          <input id="panning" type="range" min="-1" max="1" step="0.1" value="0">
        </label>
      </section>

      <section class="sounds" aria-label="Sound palette">
        <button id="sound-chime" type="button">Chime</button>
        <button id="sound-sparkle" type="button">Sparkle</button>
        <button id="sound-droplet" type="button">Droplet</button>
        <button id="sound-bloom" type="button">Bloom</button>
        <button id="sound-whisper" type="button">Whisper</button>
        <button id="sound-tick" type="button">Tick</button>
        <button id="sound-press" type="button">Press</button>
        <button id="sound-release" type="button">Release</button>
        <button id="sound-toggle" type="button">Toggle</button>
        <button id="sound-success" type="button">Success</button>
        <button id="sound-error" type="button">Error</button>
        <button id="sound-page" type="button">Page</button>
        <button id="sound-loading" type="button">Loading</button>
        <button id="sound-ready" type="button">Ready</button>
        <button id="sound-pulse" type="button">Pulse</button>
        <button id="sound-scan" type="button">Scan</button>
        <button id="sound-arrival" type="button">Arrival</button>
      </section>

      <p id="status" role="status" aria-live="polite">Ready. Choose a sound.</p>
    </main>
    <script type="module">
      import init from "/cuelume_wasm_example.js";

      init().catch((error) => {
        console.error(error);
        document.getElementById("status").textContent = `Could not start WebAssembly: ${error}`;
      });
    </script>
  </body>
</html>
